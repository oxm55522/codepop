[package]
name = "codepop"
version = "0.1.0"
description = "어디서든 코드를 드래그하고 단축키로 한국어 설명을 받는 macOS 데스크탑 도구"
authors = ["minjaehong"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "codepop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "rt", "macros"] }
sha2 = "0.10"
hex = "0.4"
dirs = "5"
sys-locale = "0.3"

# 글로벌 단축키 (⌘⇧E)
tauri-plugin-global-shortcut = "2"

# 선택 텍스트 캡처 (네이티브)
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"      # CGEvent 로 ⌘C 합성
core-foundation = "0.10"    # CFDictionary (Accessibility 권한 프롬프트)
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSData"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSPasteboardItem"] }
